
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youtube dashboard</title>

  <script src="https://accounts.google.com/gsi/client" async></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 36px 28px;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 20px #0000000a;
    }

    .logo {
      font-size: 38px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 10px;
    }

    .subtitle {
      color: #666;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    #google-button {
      display: flex;
      justify-content: center;
      min-height: 44px;
    }

    .notice {
      margin-top: 24px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f7ff;
      color: #34516c;
      font-size: 13px;
      line-height: 1.5;
    }

    #status {
      margin-top: 16px;
      overflow-wrap: anywhere;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">▶️</div>

    <h1>Copyright Studio</h1>

    <p class="subtitle">
      Sign in to access your copyright dashboard
      and review available copyright reports.
    </p>

    <div id="google-button">
      <p>Google sign-in requires setup.</p>
    </div>

    <div id="status" role="status"></div>

    <div class="notice">
      This website provides copyright information and
      warnings. It does not ban YouTube channels or
      issue official YouTube copyright strikes.
    </div>
  </main>

  <script>
    // Replace this with your Google OAuth Web client ID.
    const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID";

    function handleGoogleSignIn(response) {
      // This is a demo callback.
      // Never treat a browser-decoded token as verified identity.
      // Verify the credential securely on a server before
      // granting access to private account features.

      document.getElementById("status").textContent =
        "Google sign-in returned a credential. " +
        "A secure server is needed to verify your identity.";
      
      console.log("Google sign-in response received.");
    }

    window.addEventListener("load", () => {
      if (
        GOOGLE_CLIENT_ID === "YOUR_GOOGLE_CLIENT_ID" ||
        !GOOGLE_CLIENT_ID
      ) {
        document.getElementById("status").textContent =
          "Setup needed: add your Google OAuth client ID.";
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleSignIn
      });

      google.accounts.id.renderButton(
        document.getElementById("google-button"),
        {
          theme: "outline",
          size: "large",
          text: "signin_with",
          shape: "rectangular",
          width: 300
        }
      );
    });
  </script>
</body>
</html>
